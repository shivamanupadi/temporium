name: Tempo Node Manager - Build and Release

on:
  push:
    tags:
      - 'node-manager-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v1.0.0)'
        required: true

permissions:
  contents: write

env:
  # Cloudflare R2 Configuration
  R2_BUCKET: temporium-cdn
  R2_PUBLIC_URL: https://cdn.temporium.xyz
  R2_PATH: node-manager/releases
  # Working directory
  APP_DIR: apps/tempo-node-manager

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/tempo-node-manager

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies (monorepo root)
        working-directory: .
        run: yarn install --frozen-lockfile

      - name: Build shared types
        working-directory: packages/tempo-node-types
        run: yarn build

      - name: Build web UI
        working-directory: apps/tempo-node-manager/web
        run: yarn build

      - name: Build agent
        working-directory: apps/tempo-node-manager/agent
        run: yarn build

      - name: Get version
        id: version
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          # Strip 'node-manager-' prefix if present
          VERSION="${VERSION#node-manager-}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Prepare release package
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          # Create release directory
          mkdir -p release/tempo-node-manager

          # Copy agent dist
          cp -r agent/dist release/tempo-node-manager/

          # Copy web dist
          mkdir -p release/tempo-node-manager/web
          cp -r web/dist release/tempo-node-manager/web/dist

          # Create minimal package.json for production
          echo '{"name":"tempo-node-manager","version":"'"${VERSION#v}"'","private":true,"main":"dist/main.js","scripts":{"start":"node dist/main.js"}}' | jq . > release/tempo-node-manager/package.json

          # Copy node_modules (production only)
          cd agent
          yarn install --production --frozen-lockfile
          cp -r node_modules ../release/tempo-node-manager/
          cd ..

          # Create tarball
          cd release
          tar -czvf tempo-node-manager.tar.gz tempo-node-manager
          CHECKSUM=$(sha256sum tempo-node-manager.tar.gz | cut -d' ' -f1)
          echo "$CHECKSUM  tempo-node-manager.tar.gz" > sha256sum.txt

          # Create release.json with metadata
          RELEASE_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          jq -n \
            --arg version "${VERSION#v}" \
            --arg tag "${VERSION}" \
            --arg checksum "${CHECKSUM}" \
            --arg releaseDate "${RELEASE_DATE}" \
            --arg downloadUrl "${{ env.R2_PUBLIC_URL }}/${{ env.R2_PATH }}/${VERSION}/tempo-node-manager.tar.gz" \
            --arg releaseNotes "https://github.com/${{ github.repository }}/releases/tag/node-manager-${VERSION}" \
            '{version:$version,tag:$tag,checksum:$checksum,filename:"tempo-node-manager.tar.gz",releaseDate:$releaseDate,downloadUrl:$downloadUrl,releaseNotes:$releaseNotes}' \
            > release.json

          echo "Release package created:"
          ls -lh tempo-node-manager.tar.gz
          cat release.json

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v1
        with:
          tag_name: node-manager-${{ steps.version.outputs.version }}
          name: Tempo Node Manager ${{ steps.version.outputs.version }}
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, 'alpha') || contains(steps.version.outputs.version, 'beta') }}
          files: |
            apps/tempo-node-manager/release/tempo-node-manager.tar.gz
            apps/tempo-node-manager/release/sha256sum.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          # Upload version-specific files
          aws s3 cp release/tempo-node-manager.tar.gz "s3://${{ env.R2_BUCKET }}/${{ env.R2_PATH }}/${VERSION}/tempo-node-manager.tar.gz"
          aws s3 cp release/sha256sum.txt "s3://${{ env.R2_BUCKET }}/${{ env.R2_PATH }}/${VERSION}/sha256sum.txt"
          aws s3 cp release/release.json "s3://${{ env.R2_BUCKET }}/${{ env.R2_PATH }}/${VERSION}/release.json"

          # Upload to latest/
          aws s3 cp release/tempo-node-manager.tar.gz "s3://${{ env.R2_BUCKET }}/${{ env.R2_PATH }}/latest/tempo-node-manager.tar.gz"
          aws s3 cp release/sha256sum.txt "s3://${{ env.R2_BUCKET }}/${{ env.R2_PATH }}/latest/sha256sum.txt"
          aws s3 cp release/release.json "s3://${{ env.R2_BUCKET }}/${{ env.R2_PATH }}/latest/release.json"

          # Upload install script
          aws s3 cp scripts/install.sh "s3://${{ env.R2_BUCKET }}/${{ env.R2_PATH }}/install.sh"

          echo "Deployed to Cloudflare R2!"
          echo "Install URL: ${{ env.R2_PUBLIC_URL }}/${{ env.R2_PATH }}/install.sh"
          echo "Download URL: ${{ env.R2_PUBLIC_URL }}/${{ env.R2_PATH }}/latest/tempo-node-manager.tar.gz"
