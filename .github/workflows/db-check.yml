name: DB Schema Check

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/wallet/api/src/db/**'

jobs:
  db-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: yarn install --frozen-lockfile
      - run: cd apps/wallet/api && yarn db:check
