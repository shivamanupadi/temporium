# Prometheus configuration for Tempo Node Manager
# This file is used when running Prometheus alongside the node manager

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Tempo Node Manager metrics
  - job_name: 'tempo-node-manager'
    static_configs:
      - targets: ['host.docker.internal:9545']
    metrics_path: '/api/metrics/prometheus'
    scrape_interval: 10s

  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
