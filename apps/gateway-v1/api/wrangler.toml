name = "temporium-gateway-v1-api"
main = "src/index.ts"
compatibility_date = "2024-12-26"
compatibility_flags = ["nodejs_compat"]

# Production: Custom domain
routes = [{ pattern = "gateway-v1-api.temporium.xyz", custom_domain = true }]

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "temporium-gateway-v1-db"
database_id = "placeholder-gateway-v1-db-id"

# Environment Variables
[vars]
ALLOWED_ORIGINS = "*"
TEMPO_CHAIN_ID = "1559"
TEMPO_EXPLORER_URL = "https://explorer.temporium.xyz"

# Secrets (set via CLI):
# wrangler secret put JWT_SECRET

# Staging Environment
[env.staging]
name = "temporium-gateway-v1-api-staging"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "temporium-gateway-v1-db-staging"
database_id = "placeholder-staging-db-id"
