name = "temporium-playground-api"
main = "src/index.ts"
compatibility_date = "2024-12-26"
compatibility_flags = ["nodejs_compat"]

# Custom domain
routes = [
  { pattern = "api.playground.temporium.xyz", custom_domain = true },
]

# D1 Database (default: local dev)
[[d1_databases]]
binding = "DB"
database_name = "temporium-playground-db"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "src/db/migrations"

# Single worker serving both testnet and mainnet via X-Tempo-Network header
[vars]
ALLOWED_ORIGINS = "*"
JWT_EXPIRATION = "24h"

# Secrets:
# wrangler secret put JWT_SECRET
