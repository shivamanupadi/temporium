name = "temporium-wallet-api"
main = "src/index.ts"
compatibility_date = "2024-12-26"
compatibility_flags = ["nodejs_compat"]

# Custom domain
routes = [
  { pattern = "api.wallet.temporium.xyz", custom_domain = true },
]

# D1 Database (default: local dev)
[[d1_databases]]
binding = "DB"
database_name = "temporium-wallet-db"
database_id = "4eda211b-369a-4d07-ac5b-5f92c6906338"
migrations_dir = "src/db/migrations"

# Durable Objects
[durable_objects]
bindings = [
  { name = "SCHEDULED_TX", class_name = "ScheduledTransactionDO" },
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ScheduledTransactionDO"]

# Single worker serving both testnet and mainnet via X-Tempo-Network header
[vars]
ALLOWED_ORIGINS = "*"
JWT_EXPIRATION = "24h"
TESTNET_PASSKEY_REGISTRY_ADDRESS = "0x612F63Ab7c5fADc0915f8Dd7F8176e7d458e6844"
MAINNET_PASSKEY_REGISTRY_ADDRESS = "0x0000000000000000000000000000000000000000"

# Secrets:
# wrangler secret put JWT_SECRET
# wrangler secret put TESTNET_RELAYER_PRIVATE_KEY
# wrangler secret put MAINNET_RELAYER_PRIVATE_KEY
