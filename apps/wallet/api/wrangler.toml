name = "temporium-api"
main = "src/index.ts"
compatibility_date = "2024-12-26"
compatibility_flags = ["nodejs_compat"]

# Custom domain
routes = [
  { pattern = "api.temporium.xyz", custom_domain = true },
]

# D1 Database (default: local dev)
[[d1_databases]]
binding = "DB"
database_name = "temporium-db"
database_id = "f4f31f16-b5b5-4dfe-9e6e-5f08bdca09cb"
migrations_dir = "src/db/migrations"

# Durable Objects
[durable_objects]
bindings = [
  { name = "SCHEDULED_TX", class_name = "ScheduledTransactionDO" },
  { name = "RECURRING_PAYMENT", class_name = "RecurringPaymentDO" },
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ScheduledTransactionDO"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["RecurringPaymentDO"]

# Single worker serving both testnet and mainnet via X-Tempo-Network header
[vars]
TESTNET_RECURRING_PAYMENTS_ADDRESS = "0x4aC1113E50a40D8fC9bed352ECF393b25DB5462d"
ALLOWED_ORIGINS = "*"
JWT_EXPIRATION = "24h"
MAINNET_PASSKEY_REGISTRY_ADDRESS = "0x82fc6317BC59AD48f5d6Fdfe9FD5fee47a503C65"
MAINNET_RECURRING_PAYMENTS_ADDRESS = "0x8bB0533c3c196277b36673499a852969e8B5C428"

# Secrets:
# wrangler secret put JWT_SECRET
# wrangler secret put TESTNET_RELAYER_PRIVATE_KEY
# wrangler secret put MAINNET_RELAYER_PRIVATE_KEY
