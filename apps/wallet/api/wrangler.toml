name = "temporium-api"
account_id = "4cf68c768770ccda55d287d6ecbdeb4f"
main = "src/index.ts"
compatibility_date = "2024-12-26"
compatibility_flags = ["nodejs_compat"]

# Custom domain
routes = [
  { pattern = "api.temporium.xyz", custom_domain = true },
]

# D1 Database (default: local dev)
[[d1_databases]]
binding = "DB"
database_name = "temporium-db"
database_id = "f4f31f16-b5b5-4dfe-9e6e-5f08bdca09cb"
migrations_dir = "src/db/migrations"

# Durable Objects
[durable_objects]
bindings = [
  { name = "SCHEDULED_TX", class_name = "ScheduledTransactionDO" },
  { name = "MINE_SALT_CONTAINER", class_name = "MineSaltContainer" },
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ScheduledTransactionDO"]

# v2 created RecurringPaymentDO (since removed); v3 deletes it.
# Leaving v1 and v2 in the history is required — wrangler uses the tag
# sequence to compute which migrations to apply against the deployed script.
[[migrations]]
tag = "v2"
new_sqlite_classes = ["RecurringPaymentDO"]

[[migrations]]
tag = "v3"
deleted_classes = ["RecurringPaymentDO"]

# v4 introduces the TIP-1022 salt-mining container (Cloudflare Containers,
# standard-4 = 4 vCPU). This is a Container DO — same migration syntax as a
# regular SQLite DO, the runtime infers it's container-backed from the
# [[containers]] block below.
[[migrations]]
tag = "v4"
new_sqlite_classes = ["MineSaltContainer"]

# TIP-1022 salt-mining container.
# standard-4 = 4 vCPU / 12 GiB / 20 GB disk — sized for parallel WASM keccak
# workers. max_instances caps concurrent grinds; bump if registration volume
# spikes.
[[containers]]
class_name = "MineSaltContainer"
image = "./containers/mine-salt/Dockerfile"
instance_type = "standard-4"
max_instances = 5

# Single worker serving both testnet and mainnet via X-Tempo-Network header.
#
# All env vars + secrets live in Doppler (project: temporium-api). Locally,
# `yarn dev` materializes them into .dev.vars.doppler before running
# `wrangler dev`. In production, `yarn secrets:prod:sync` pushes them to
# Cloudflare Worker secrets via `wrangler secret bulk --env production`.
#
# Do NOT add a [vars] block here — that would create two sources of truth
# and Doppler would silently override it at runtime anyway.

# ─── Production ───
# Deploy with: wrangler deploy --env production
#
# The prod env keeps `name = "temporium-api"` so it targets the existing
# worker (no migration / domain swap needed). Bindings are duplicated from
# the top-level block — wrangler does not inherit routes / d1 / DOs into
# named environments, so each has to be redeclared here.

[env.production]
name = "temporium-api"
routes = [
  { pattern = "api.temporium.xyz", custom_domain = true },
]

[[env.production.d1_databases]]
binding = "DB"
database_name = "temporium-db"
database_id = "f4f31f16-b5b5-4dfe-9e6e-5f08bdca09cb"
migrations_dir = "src/db/migrations"

[env.production.durable_objects]
bindings = [
  { name = "SCHEDULED_TX", class_name = "ScheduledTransactionDO" },
  { name = "MINE_SALT_CONTAINER", class_name = "MineSaltContainer" },
]

[[env.production.migrations]]
tag = "v1"
new_sqlite_classes = ["ScheduledTransactionDO"]

[[env.production.migrations]]
tag = "v2"
new_sqlite_classes = ["RecurringPaymentDO"]

[[env.production.migrations]]
tag = "v3"
deleted_classes = ["RecurringPaymentDO"]

[[env.production.migrations]]
tag = "v4"
new_sqlite_classes = ["MineSaltContainer"]

[[env.production.containers]]
class_name = "MineSaltContainer"
image = "./containers/mine-salt/Dockerfile"
instance_type = "standard-4"
max_instances = 5
