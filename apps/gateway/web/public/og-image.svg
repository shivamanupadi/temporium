<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#ffffff"/>

  <!-- Subtle gradient blobs -->
  <defs>
    <radialGradient id="blob1" cx="30%" cy="40%" r="40%">
      <stop offset="0%" stop-color="#7c5cff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob2" cx="70%" cy="60%" r="35%">
      <stop offset="0%" stop-color="#0073e6" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0073e6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#blob1)"/>
  <rect width="1200" height="630" fill="url(#blob2)"/>

  <!-- Logo Icon (Zap) -->
  <g transform="translate(540, 180)">
    <svg width="120" height="120" viewBox="0 0 24 24" fill="none" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/>
    </svg>
  </g>

  <!-- Brand Name -->
  <text x="600" y="360" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="700" fill="#0f172a" letter-spacing="-1">Temporium</text>

  <!-- Tagline -->
  <text x="600" y="420" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="500" fill="#64748b">Your Gateway to Tempo Blockchain powered by decentralised passkey wallet</text>

  <!-- Features pill -->
  <g transform="translate(600, 480)">
    <rect x="-220" y="-18" width="440" height="36" rx="18" fill="#f1f5f9"/>
    <text x="0" y="6" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" fill="#475569">Send  ·  Swap  ·  Liquidity  ·  Tokens  ·  Policies</text>
  </g>
</svg>
