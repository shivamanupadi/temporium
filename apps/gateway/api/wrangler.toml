name = "temporium-gateway-api"
main = "src/index.ts"
compatibility_date = "2024-12-26"
compatibility_flags = ["nodejs_compat"]

# Production: Custom domain
routes = [{ pattern = "gateway-api.temporium.xyz", custom_domain = true }]

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "temporium-db"
database_id = "b38de441-3dfd-4757-bc52-2a0294ae1fa1"

# Environment Variables
[vars]
ALLOWED_ORIGINS = "*"

# Secrets (set via CLI):
# wrangler secret put JWT_SECRET

# Staging Environment
[env.staging]
name = "temporium-gateway-api-staging"
# routes = [
#   { pattern = "api-staging.temporium.xyz/*", custom_domain = true }
# ]

[[env.staging.d1_databases]]
binding = "DB"
database_name = "temporium-db-staging"
database_id = "placeholder-staging-db-id"
