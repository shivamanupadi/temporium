name = "tollr-keys"
main = "src/index.ts"
compatibility_date = "2024-12-01"

# D1 Database binding
# Run `yarn db:create` first, then update the database_id below
[[d1_databases]]
binding = "DB"
database_name = "tollr-passkeys"
database_id = "f3c40951-291e-4a2d-a76e-6bde83bbdfc3"

# Environment variables
[vars]
ENVIRONMENT = "production"

# Development settings
[dev]
port = 8787
local_protocol = "http"
